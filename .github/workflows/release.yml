name: build

# Every v* tag builds all packages, publishes the Docker image (amd64 + arm64) and attaches
# everything to the GitHub Release for that tag. Manual runs build without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/jas0xa/opencord

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  linux:
    needs: test
    strategy:
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Built natively on each architecture: server tarball (with Node + web app) and AppImage.
      - run: ./scripts/package-server.sh
      - run: npm run dist:linux -w @opencord/client -- --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            release/*.tar.gz
            packages/client/release/*.AppImage

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: powershell -ExecutionPolicy Bypass -File scripts\package-server.ps1
      - run: npm run dist:win -w @opencord/client
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.zip
            packages/client/release/*.exe

  # Each architecture's image is built natively (no QEMU), pushed by digest, then merged below.
  docker:
    needs: test
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest, tag: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, tag: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: ${{ startsWith(github.ref, 'refs/tags/v') && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
      - name: Record digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/$(echo '${{ steps.build.outputs.digest }}' | cut -d: -f2)"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with: { name: 'digest-${{ matrix.tag }}', path: /tmp/digests/*, retention-days: 1 }

  docker-manifest:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'digest-*', path: /tmp/digests, merge-multiple: true }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Tag <version> and latest
        working-directory: /tmp/digests
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    needs: [linux, windows, docker-manifest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          FILES=$(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.exe' \))
          echo "$FILES"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "OpenCord ${GITHUB_REF_NAME#v}" --generate-notes $FILES
          fi
